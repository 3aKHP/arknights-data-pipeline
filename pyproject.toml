[project]
name = "akdp"
version = "0.1.0.dev0"
description = "Arknights CN game data unpack & packaging pipeline (PRTS-MCP data factory)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
fetch = ["arkprts[all]"]

[project.scripts]
akdp = "akdp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akdp"]

[dependency-groups]
dev = ["pytest>=8.0"]
