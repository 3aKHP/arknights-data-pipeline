name: Data Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Run the full path even when versionId is unchanged"
        required: false
        default: false
        type: boolean

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LEDGER_ENDPOINT_URL: ${{ secrets.LEDGER_ENDPOINT_URL }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --all-extras --locked

      - name: Run pipeline unit tests
        run: uv run pytest tests -q

      - name: Setup flatc
        run: |
          curl -fsSL -o flatc \
            https://raw.githubusercontent.com/MooncellWiki/torappu/37e645f4528248b639b63c35dbb63ee7ae64a315/bin/flatc
          test -s flatc
          echo "b5adf3dbc4867a3f08acf6e30f32671f114d189093da07453ff2764c6acdd925  flatc" | sha256sum -c -
          chmod +x flatc && sudo mv flatc /usr/local/bin/flatc

      - name: Run JSON pipeline
        env:
          FORCE_RUN: ${{ inputs.force || false }}
        run: |
          args=(--workdir work run --publish)
          if [[ "$FORCE_RUN" == "true" ]]; then args+=(--force); fi
          uv run akdp "${args[@]}"

      - name: Upload LLM call ledger
        # The ledger carries full provider detail and is private evidence;
        # it goes to a dedicated private endpoint only, never to public
        # artifacts. Skipped until LEDGER_ENDPOINT_URL is configured.
        if: ${{ env.LEDGER_ENDPOINT_URL != '' }}
        env:
          LEDGER_ENDPOINT_TOKEN: ${{ secrets.LEDGER_ENDPOINT_TOKEN }}
        run: |
          if [ ! -s work/llm-ledger.jsonl ]; then
            echo "No LLM calls this run; nothing to upload."
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl --fail-with-body -sS -o /dev/null -w '%{http_code}' \
              -X POST "$LEDGER_ENDPOINT_URL" \
              -H "Authorization: Bearer $LEDGER_ENDPOINT_TOKEN" \
              -H "Content-Type: application/x-ndjson" \
              -H "X-AKDP-Run-ID: ${GITHUB_RUN_ID}" \
              -H "X-AKDP-Repository: ${GITHUB_REPOSITORY}" \
              -H "X-AKDP-Run-At: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -H "X-AKDP-Run-Attempt: ${GITHUB_RUN_ATTEMPT}" \
              --data-binary @work/llm-ledger.jsonl) && exit 0
            echo "Ledger upload attempt $i failed (HTTP $code); retrying..."
            sleep $((i * 5))
          done
          echo "::error::LLM ledger upload failed after 3 attempts"
          exit 1

      - name: Prepare image pipeline inputs
        run: |
          # 1. Ensure excel tables exist (JSON step may have short-circuited).
          if [ ! -d work/candidate/zh_CN/gamedata/excel ]; then
            echo "JSON pipeline short-circuited; downloading latest excel tables..."
            gh release download -R "$GH_REPO" -p zh_CN-excel.zip --clobber --output /tmp/excel.zip
            mkdir -p work/candidate
            (cd work/candidate && unzip -q /tmp/excel.zip)
          fi
          # 2. Fetch previous image index for delta computation.
          mkdir -p work/images-prev
          LATEST_TAG=$(uv run akdp images-latest-tag)
          if [ -n "$LATEST_TAG" ]; then
            gh release download -R "$GH_REPO" "$LATEST_TAG" -p index.json \
              --output work/images-prev/index.json --clobber
            echo "Downloaded previous image index from $LATEST_TAG"
            if gh release view -R "$GH_REPO" "$LATEST_TAG" --json assets \
              --jq '.assets[].name' | grep -Fxq 'images-build-state.json'; then
              gh release download -R "$GH_REPO" "$LATEST_TAG" -p images-build-state.json \
                --output work/images-prev/images-build-state.json --clobber
              echo "Downloaded previous image build state from $LATEST_TAG"
            else
              echo "Previous image Release has no build state; image pipeline will safely rebuild in full"
            fi
          else
            echo "No previous image release found; will produce baseline"
          fi

      - name: Run image pipeline
        env:
          FORCE_RUN: ${{ inputs.force || false }}
        run: |
          args=(--workdir work images-run --publish --excel-dir work/candidate/zh_CN/gamedata/excel)
          if [[ "$FORCE_RUN" == "true" ]]; then args+=(--force); fi
          uv run akdp "${args[@]}"
