name: Data Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Run the full path even when versionId is unchanged"
        required: false
        default: false
        type: boolean

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --all-extras --locked

      - name: Run pipeline unit tests
        run: uv run pytest tests -q

      - name: Setup flatc
        run: |
          curl -fsSL -o flatc \
            https://raw.githubusercontent.com/MooncellWiki/torappu/37e645f4528248b639b63c35dbb63ee7ae64a315/bin/flatc
          test -s flatc
          echo "b5adf3dbc4867a3f08acf6e30f32671f114d189093da07453ff2764c6acdd925  flatc" | sha256sum -c -
          chmod +x flatc && sudo mv flatc /usr/local/bin/flatc

      - name: Run JSON pipeline
        env:
          FORCE_RUN: ${{ inputs.force || false }}
        run: |
          args=(--workdir work run --publish)
          if [[ "$FORCE_RUN" == "true" ]]; then args+=(--force); fi
          uv run akdp "${args[@]}"

      - name: Run image pipeline
        env:
          FORCE_RUN: ${{ inputs.force || false }}
        run: |
          if [ -d work/candidate/zh_CN/gamedata/excel ]; then
            args=(--workdir work images-run --publish --excel-dir work/candidate/zh_CN/gamedata/excel)
            if [[ "$FORCE_RUN" == "true" ]]; then args+=(--force); fi
            uv run akdp "${args[@]}"
          else
            echo "JSON pipeline short-circuited (no new data); skipping images"
          fi
