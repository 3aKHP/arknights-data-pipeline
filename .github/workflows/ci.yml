name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: "PRTS-MCP compiler commit/tag (repository variable or pinned commit by default)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Checkout the versioned PRTS data compiler
        uses: actions/checkout@v7
        with:
          repository: 3aKHP/prts-mcp
          ref: ${{ inputs.compiler_ref || vars.PRTS_DATA_COMPILER_REF || '4d71009b24c4ff1a5c8916253a85896cc1e2a750' }}
          path: .compiler-src
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.96.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .compiler-src -> target
          key: sqlite-compiler-v1

      - name: Build the SQLite data compiler
        run: |
          cargo build --manifest-path .compiler-src/Cargo.toml --locked --release --example data_compiler
          echo "PRTS_DATA_COMPILER=$GITHUB_WORKSPACE/.compiler-src/target/release/examples/data_compiler" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --all-extras --locked
      - name: Run unit tests
        run: uv run --frozen pytest tests -q
