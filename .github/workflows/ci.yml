name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: "PRTS-MCP compiler commit/tag (repository variable or pinned commit by default)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build the versioned PRTS data compiler
        uses: ./.github/actions/build-prts-compiler
        with:
          compiler-ref: ${{ inputs.compiler_ref || vars.PRTS_DATA_COMPILER_REF }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync --all-extras --locked
      - name: Run unit tests
        run: uv run --frozen pytest tests -q
